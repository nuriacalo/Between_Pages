spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/between_pages}
    username: ${DB_USERNAME:nuriacalo}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: ${JPA_SHOW_SQL:true}
    open-in-view: false

    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

google:
  books:
    api-key: ${GOOGLE_BOOKS_API_KEY:}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

logging:
  level:
    com.calonuria.backend: ${LOG_LEVEL:INFO}
    org.springframework.security: INFO

server:
  port: ${SERVER_PORT:8080}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}
